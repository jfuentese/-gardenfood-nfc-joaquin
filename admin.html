<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Stand GardenFood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#2E1A54; --purple:#4B2A82; --purple-soft:#EFEAF7;
    --green:#7ED321; --amber:#F5A623; --gray:#B5AEC2; --red:#D64545;
    --paper:#FBFAF8; --ink:#221733; --ink-soft:#6B6178; --line:#E4DEF0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;padding:24px 18px 60px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:28px 0 12px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;}

  .current{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:20px;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--gray);flex-shrink:0;transition:background .3s;}
  .current strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:14px;}
  .current span{font-size:11.5px;color:var(--ink-soft);}

  button{border:none;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;cursor:pointer;}
  .stand-btn{width:100%;padding:15px;font-size:14.5px;margin-bottom:10px;color:#fff;}
  .btn-disponible{background:var(--green);color:var(--purple-deep);}
  .btn-ocupado{background:var(--amber);}
  .btn-fuera{background:var(--gray);color:var(--purple-deep);}
  .btn-auto{background:transparent;color:var(--purple);border:1.5px solid var(--purple-soft);width:100%;padding:13px;font-size:13.5px;margin-top:6px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:'Inter',sans-serif;
    font-size:14px;margin-bottom:10px;background:var(--paper);color:var(--ink);}
  textarea{resize:vertical;min-height:60px;}
  label{font-size:11.5px;color:var(--ink-soft);display:block;margin:0 0 4px;font-weight:500;}
  .divider{height:1px;background:var(--line);margin:14px 0;}

  .en-curso-banner{background:var(--purple-deep);color:#fff;border-radius:12px;padding:10px 14px;font-size:12.5px;
    margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .en-curso-banner .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;
    animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .sku-row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;position:relative;}
  .sku-row.guardado{background:#F3F9EC;border-color:#C9E8A8;}
  .sku-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sku-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;margin-top:4px;}
  .badge-alto{background:#FDEAEA;color:var(--red);}
  .badge-medio{background:#FEF3E0;color:#B8720A;}
  .badge-bajo{background:#EFEAF7;color:var(--ink-soft);}
  .sku-remove{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:0;}
  .sku-save{background:var(--purple-deep);color:#fff;width:100%;padding:9px;font-size:12.5px;margin-top:4px;}
  .sku-saved-tag{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#4F9915;font-weight:600;margin-top:4px;}

  .add-sku{background:var(--purple-soft);color:var(--purple-deep);width:100%;padding:10px;font-size:13px;margin-bottom:14px;}
  .save-btn{background:var(--purple-deep);color:#fff;width:100%;padding:15px;font-size:14.5px;}
  .finalizar-btn{background:var(--green);color:var(--purple-deep);width:100%;padding:16px;font-size:15px;margin-top:6px;}

  .note-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .note-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .note-item strong{font-family:'Space Grotesk',sans-serif;font-size:14px;}
  .note-item .meta{font-size:11px;color:var(--ink-soft);}
  .note-item .nota-txt{font-size:13px;color:var(--ink);margin:6px 0;}
  .note-item .skus{font-size:12px;color:var(--ink-soft);}
  .note-item .skus div{padding:3px 0;border-top:1px solid var(--line);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--purple-deep);
    color:#fff;padding:12px 20px;border-radius:100px;font-size:13.5px;opacity:0;transition:all .25s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel del stand</h1>
  <p class="sub">Solo tú deberías tener este link.</p>

  <div class="current">
    <span class="dot" id="dot"></span>
    <div>
      <strong id="estadoTxt">Cargando…</strong>
      <span id="modoTxt"></span>
    </div>
  </div>

  <button class="stand-btn btn-disponible" onclick="setEstado('disponible')">Disponible en Stand</button>
  <button class="stand-btn btn-ocupado" onclick="setEstado('ocupado')">Ocupado</button>
  <button class="stand-btn btn-fuera" onclick="setEstado('fuera')">Fuera del stand</button>
  <button class="btn-auto" onclick="setModoAuto()">Volver a modo automático</button>

  <h2>Reunión</h2>

  <div id="bannerEnCurso" style="display:none;" class="en-curso-banner">
    <span class="pulse"></span> Reunión en curso — se guarda automático
  </div>

  <div class="card">
    <div id="datosCliente">
      <label>Vendedor (tus iniciales)</label>
      <input id="fVendedor" placeholder="Ej: JFU">
      <div class="divider"></div>
      <label>Nombre (contacto)</label>
      <input id="fCliente" placeholder="Ej: Pedro Pablo">
      <label>Razón Social</label>
      <input id="fRazonSocial" placeholder="Ej: Kamver SpA">
      <label>Nombre de fantasía</label>
      <input id="fNombreFantasia" placeholder="Ej: Kamisushi">
    </div>

    <button class="save-btn" id="btnIniciar" onclick="iniciarReunion()">Iniciar reunión</button>

    <div id="seccionSkus" style="display:none;">
      <div class="divider"></div>
      <label>SKUs de interés</label>
      <div id="skuList"></div>
      <button class="add-sku" onclick="addSkuRow()">+ Agregar SKU</button>

      <label>Nota general</label>
      <textarea id="fNota" placeholder="Contexto de la conversación, próximos pasos, etc." onblur="autosaveNota()"></textarea>

      <button class="finalizar-btn" onclick="finalizarReunion()">✓ Finalizar reunión</button>
    </div>
  </div>

  <h2>Reuniones finalizadas</h2>
  <div id="notesList"><p class="sub">Cargando…</p></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  var SB_URL = 'https://wnnwgcatjsbcqekktvmy.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndubndnY2F0anNiY3Fla2t0dm15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODA5OTksImV4cCI6MjEwMzI1Njk5OX0.BKpREaJdjv4V9kMZVfCAw4I4GAEX2aUYeZQtULlVzmw';
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var map = {
    disponible: { label: 'Disponible en stand', color: '#7ED321' },
    ocupado: { label: 'Ocupado', color: '#F5A623' },
    fuera: { label: 'Fuera del stand', color: '#B5AEC2' }
  };

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // ---- Recordar vendedor entre sesiones ----
  var vendedorGuardado = localStorage.getItem('gf_vendedor');
  if (vendedorGuardado) document.getElementById('fVendedor').value = vendedorGuardado;

  // ---- Estado del stand ----
  function refreshEstado() {
    sb.from('stand_status').select('estado,modo').eq('id', 1).single().then(function(res) {
      var data = res.data;
      if (!data) return;
      document.getElementById('estadoTxt').textContent = map[data.estado] ? map[data.estado].label : data.estado;
      document.getElementById('modoTxt').textContent = data.modo === 'auto' ? 'Modo automático (según calendario)' : 'Fijado manualmente';
      document.getElementById('dot').style.background = map[data.estado] ? map[data.estado].color : '#B5AEC2';
    });
  }
  function setEstado(nuevo) {
    sb.from('stand_status').update({ estado: nuevo, modo: 'manual', actualizado_en: new Date().toISOString() }).eq('id', 1)
      .then(function(){ showToast('Estado actualizado: ' + map[nuevo].label); refreshEstado(); });
  }
  function setModoAuto() {
    sb.from('stand_status').update({ modo: 'auto', actualizado_en: new Date().toISOString() }).eq('id', 1)
      .then(function(){ showToast('Modo automático activado'); refreshEstado(); });
  }

  // ---- Reunión en curso ----
  var meetingId = localStorage.getItem('gf_meeting_id');

  function parseCLNumber(str) {
    if (!str) return 0;
    var clean = String(str).replace(/\./g, '').replace(/,/g, '.').replace(/[^\d.]/g, '');
    var n = parseFloat(clean);
    return isNaN(n) ? 0 : n;
  }

  function importanciaDeMonto(monto) {
    if (monto >= 3000000) return { nivel: 'alto', label: 'ALTO', clase: 'badge-alto' };
    if (monto >= 1000000) return { nivel: 'medio', label: 'MEDIO', clase: 'badge-medio' };
    return { nivel: 'bajo', label: 'BAJO', clase: 'badge-bajo' };
  }

  function iniciarReunion() {
    var vendedor = document.getElementById('fVendedor').value.trim();
    var cliente = document.getElementById('fCliente').value.trim();
    if (!cliente) { showToast('Falta el nombre del contacto'); return; }
    localStorage.setItem('gf_vendedor', vendedor);

    var payload = {
      vendedor: vendedor, cliente: cliente,
      razon_social: document.getElementById('fRazonSocial').value.trim(),
      nombre_fantasia: document.getElementById('fNombreFantasia').value.trim(),
      estado: 'en_curso'
    };

    sb.from('meeting_notes').insert(payload).select().single().then(function(res) {
      if (res.error) { showToast('Error al iniciar'); console.error(res.error); return; }
      meetingId = res.data.id;
      localStorage.setItem('gf_meeting_id', meetingId);
      entrarModoEnCurso();
      showToast('Reunión iniciada');
    });
  }

  function entrarModoEnCurso() {
    document.getElementById('bannerEnCurso').style.display = 'flex';
    document.getElementById('btnIniciar').style.display = 'none';
    document.getElementById('seccionSkus').style.display = 'block';
    // bloquea edición de datos del cliente una vez iniciada (evita inconsistencias)
    document.querySelectorAll('#datosCliente input').forEach(function(inp){ inp.disabled = true; });
  }

  function salirModoEnCurso() {
    localStorage.removeItem('gf_meeting_id');
    meetingId = null;
    document.getElementById('bannerEnCurso').style.display = 'none';
    document.getElementById('btnIniciar').style.display = 'block';
    document.getElementById('seccionSkus').style.display = 'none';
    document.querySelectorAll('#datosCliente input').forEach(function(inp){ inp.disabled = false; inp.value = ''; });
    var vg = localStorage.getItem('gf_vendedor');
    if (vg) document.getElementById('fVendedor').value = vg;
    document.getElementById('fNota').value = '';
    document.getElementById('skuList').innerHTML = '';
    addSkuRow();
  }

  var skuCounter = 0;
  function addSkuRow() {
    skuCounter++;
    var id = 'sku' + skuCounter;
    var div = document.createElement('div');
    div.className = 'sku-row';
    div.id = id;
    div.innerHTML =
      '<button class="sku-remove" onclick="document.getElementById(\'' + id + '\').remove()">✕</button>' +
      '<label>SKU / Producto</label>' +
      '<input class="sku-nombre" placeholder="Ej: Camarón 36/40 Ecuatoriano crudo pelado">' +
      '<label>Proveedor actual (de ese SKU)</label>' +
      '<input class="sku-proveedor" placeholder="Ej: Comercial Océano">' +
      '<div class="sku-grid">' +
        '<div><label>Volumen (kg/mes)</label><input class="sku-volumen" type="text" inputmode="numeric" placeholder="1.500" oninput="updateBadge(\'' + id + '\')"></div>' +
        '<div><label>Precio ($/kg neto)</label><input class="sku-precio" type="text" inputmode="numeric" placeholder="6.300" oninput="updateBadge(\'' + id + '\')"></div>' +
      '</div>' +
      '<div class="badge-holder"></div>' +
      '<button class="sku-save" onclick="guardarSku(\'' + id + '\')">Guardar SKU</button>';
    document.getElementById('skuList').appendChild(div);
  }

  function updateBadge(id) {
    var row = document.getElementById(id);
    var vol = parseCLNumber(row.querySelector('.sku-volumen').value);
    var precio = parseCLNumber(row.querySelector('.sku-precio').value);
    var monto = vol * precio;
    var imp = importanciaDeMonto(monto);
    var holder = row.querySelector('.badge-holder');
    if (vol > 0 && precio > 0) {
      holder.innerHTML = '<span class="sku-badge ' + imp.clase + '">' + imp.label + ' · $' + monto.toLocaleString('es-CL') + '/mes</span>';
    } else {
      holder.innerHTML = '';
    }
  }

  function guardarSku(id) {
    if (!meetingId) { showToast('Primero inicia la reunión'); return; }
    var row = document.getElementById(id);
    var sku = row.querySelector('.sku-nombre').value.trim();
    if (!sku) { showToast('Falta el nombre del SKU'); return; }
    var proveedor = row.querySelector('.sku-proveedor').value.trim();
    var vol = parseCLNumber(row.querySelector('.sku-volumen').value);
    var precio = parseCLNumber(row.querySelector('.sku-precio').value);

    sb.from('meeting_items').insert({
      meeting_id: meetingId, sku: sku, proveedor_actual: proveedor || null, volumen_kg: vol || null, precio_clp: precio || null
    }).then(function(res) {
      if (res.error) { showToast('Error al guardar SKU'); console.error(res.error); return; }
      row.classList.add('guardado');
      row.querySelectorAll('input').forEach(function(inp){ inp.disabled = true; });
      row.querySelector('.sku-save').outerHTML = '<div class="sku-saved-tag">✓ Guardado</div>';
      row.querySelector('.sku-remove').remove();
      showToast('SKU guardado');
      addSkuRow(); // deja lista la siguiente fila
    });
  }

  function autosaveNota() {
    if (!meetingId) return;
    var nota = document.getElementById('fNota').value.trim();
    sb.from('meeting_notes').update({ nota: nota }).eq('id', meetingId).then(function(){});
  }

  function finalizarReunion() {
    if (!meetingId) return;
    autosaveNota();
    sb.from('meeting_items').select('volumen_kg,precio_clp').eq('meeting_id', meetingId).then(function(res) {
      var maxMonto = 0;
      (res.data || []).forEach(function(it) {
        var m = (Number(it.volumen_kg)||0) * (Number(it.precio_clp)||0);
        if (m > maxMonto) maxMonto = m;
      });
      var importancia = importanciaDeMonto(maxMonto).nivel;
      sb.from('meeting_notes').update({ estado: 'finalizada', importancia: importancia }).eq('id', meetingId).then(function(res2) {
        if (res2.error) { showToast('Error al finalizar'); console.error(res2.error); return; }
        showToast('Reunión finalizada ✓');
        salirModoEnCurso();
        cargarNotas();
      });
    });
  }

  // ---- Al cargar: si hay reunión en curso guardada, retomarla ----
  function retomarSiCorresponde() {
    if (!meetingId) { addSkuRow(); return; }
    sb.from('meeting_notes').select('*,meeting_items(id,sku,proveedor_actual,volumen_kg,precio_clp,monto_mensual)').eq('id', meetingId).single()
      .then(function(res) {
        if (res.error || !res.data || res.data.estado === 'finalizada') {
          localStorage.removeItem('gf_meeting_id'); meetingId = null; addSkuRow(); return;
        }
        var n = res.data;
        document.getElementById('fVendedor').value = n.vendedor || '';
        document.getElementById('fCliente').value = n.cliente || '';
        document.getElementById('fRazonSocial').value = n.razon_social || '';
        document.getElementById('fNombreFantasia').value = n.nombre_fantasia || '';
        document.getElementById('fNota').value = n.nota || '';
        entrarModoEnCurso();
        document.getElementById('skuList').innerHTML = '';
        (n.meeting_items || []).forEach(function(it) {
          skuCounter++;
          var id = 'sku' + skuCounter;
          var div = document.createElement('div');
          div.className = 'sku-row guardado';
          div.id = id;
          var monto = it.monto_mensual ? '$' + Number(it.monto_mensual).toLocaleString('es-CL') + '/mes' : '';
          div.innerHTML =
            '<label>SKU / Producto</label><input class="sku-nombre" value="' + it.sku + '" disabled>' +
            '<label>Proveedor actual</label><input value="' + (it.proveedor_actual||'') + '" disabled>' +
            '<div class="sku-grid">' +
              '<div><label>Volumen (kg/mes)</label><input value="' + (it.volumen_kg||'') + '" disabled></div>' +
              '<div><label>Precio ($/kg neto)</label><input value="' + (it.precio_clp||'') + '" disabled></div>' +
            '</div>' +
            (monto ? '<span class="sku-badge badge-medio">' + monto + '</span>' : '') +
            '<div class="sku-saved-tag">✓ Guardado</div>';
          document.getElementById('skuList').appendChild(div);
        });
        addSkuRow();
        showToast('Retomando reunión en curso');
      });
  }

  function cargarNotas() {
    sb.from('meeting_notes').select('id,vendedor,cliente,razon_social,nombre_fantasia,nota,importancia,creado_en,meeting_items(sku,proveedor_actual,volumen_kg,precio_clp,monto_mensual)')
      .eq('estado', 'finalizada')
      .order('creado_en', { ascending: false }).limit(30).then(function(res) {
        var list = document.getElementById('notesList');
        if (res.error) { list.innerHTML = '<p class="sub">Error al cargar</p>'; console.error(res.error); return; }
        var data = res.data || [];
        if (data.length === 0) { list.innerHTML = '<p class="sub">Sin reuniones finalizadas todavía.</p>'; return; }
        var impLabel = { alto: 'ALTO', medio: 'MEDIO', bajo: 'BAJO' };
        var impClase = { alto: 'badge-alto', medio: 'badge-medio', bajo: 'badge-bajo' };
        list.innerHTML = data.map(function(n) {
          var fecha = new Date(n.creado_en).toLocaleString('es-CL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          var nombreEmpresa = n.nombre_fantasia || n.razon_social || '';
          var skusHtml = (n.meeting_items || []).map(function(it) {
            var monto = it.monto_mensual ? '$' + Number(it.monto_mensual).toLocaleString('es-CL') + '/mes' : '';
            return '<div>' + it.sku + (it.proveedor_actual ? ' · hoy: ' + it.proveedor_actual : '') + (monto ? ' · ' + monto : '') + '</div>';
          }).join('');
          return '<div class="note-item">' +
            '<div class="top"><div><strong>' + n.cliente + '</strong><div class="meta">' + nombreEmpresa + ' · ' + (n.vendedor || '') + ' · ' + fecha + '</div></div>' +
            (n.importancia ? '<span class="sku-badge ' + impClase[n.importancia] + '">' + impLabel[n.importancia] + '</span>' : '') +
            '</div>' +
            (n.nota ? '<div class="nota-txt">' + n.nota + '</div>' : '') +
            (skusHtml ? '<div class="skus">' + skusHtml + '</div>' : '') +
            '</div>';
        }).join('');
      });
  }

  refreshEstado();
  setInterval(refreshEstado, 15000);
  retomarSiCorresponde();
  cargarNotas();
</script>
</body>
</html>
